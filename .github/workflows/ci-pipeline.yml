name: Node.js & Angular CI Pipeline

on:
  push:
    branches: [main, dev, "feature/*"]
  pull_request:
    branches: [main, dev]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # <--- Cambiado a 22

      - name: Instalar dependencias del Backend
        run: |
          cd backend
          npm install

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias y compilar Frontend
        run: |
          cd frontend
          npm install
          npm run build --if-present
